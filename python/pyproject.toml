[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-lib"
version = "0.1.0"
description = "Python implementation of the Veritas formula (spectral, residual and neighbourhood score)."
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["veritas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
